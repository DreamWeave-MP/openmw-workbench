# openmw-workbench as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `openmw_workbench-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "f8c45ec3-cbbf-4bec-9202-859088a8c0a0"
slug = "openmw_workbench"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.openmw-workbench"

[[releases]]
version = "0.6.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
