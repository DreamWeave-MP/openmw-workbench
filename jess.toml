manifest_version = 1

[package]
id = "org.dreamweave.openmw-workbench"
version = "0.6.0"
jess_api = "1"
include = ["src", "examples", "tests"]
tests = ["tests/run.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.esm" = "0.1"
"org.dreamweave.vfs" = "2"
"org.dreamweave.nif" = "0.1"
"org.dreamweave.tes3-saves" = "0.1"
"org.dreamweave.jessql" = "0.1.4"

[modules]
"@openmw-install/workbench" = "src/init.jsl"
"@openmw-install/workbench/model" = "src/model.jsl"
"@openmw-install/workbench/review" = "src/review.jsl"
"@openmw-install/workbench/graph" = "src/graph.jsl"
"@openmw-install/workbench/content" = "src/content.jsl"
"@openmw-install/workbench/knowledge" = "src/knowledge.jsl"
"@openmw-install/workbench/contract" = "src/contract.jsl"
"@openmw-install/workbench/link" = "src/link.jsl"
"@openmw-install/workbench/compact" = "src/compact.jsl"
"@openmw-install/workbench/commands" = "src/commands.jsl"
"@openmw-install/workbench/cli" = "src/cli.jsl"

[[layer]]
id = "openmw.index"
requires = ["jessql.core"]
exports = ["@openmw-install/workbench/compact"]

[[layer]]
id = "openmw.workbench"
requires = ["openmw.index", "esm.core", "vfs.core", "nif.core", "tes3-saves.core"]
exports = [
  "@openmw-install/workbench",
  "@openmw-install/workbench/model",
  "@openmw-install/workbench/review",
  "@openmw-install/workbench/graph",
  "@openmw-install/workbench/content",
  "@openmw-install/workbench/knowledge",
  "@openmw-install/workbench/contract",
  "@openmw-install/workbench/link",
]

# The command line: a review request typed in `commands`, read from argv in `cli`.
[[layer]]
id = "openmw.workbench.commands"
requires = ["openmw.workbench"]
exports = ["@openmw-install/workbench/commands", "@openmw-install/workbench/cli"]

# `jess package run --package <openmw-workbench> -- [folder...]`: reviews the mod in each folder.
[targets.openmw-workbench]
kind = "command"
command = "openmw-workbench"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "process.stdio"]
